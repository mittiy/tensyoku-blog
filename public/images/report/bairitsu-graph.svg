<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <linearGradient id="barOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="barGray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6d3d1"/>
      <stop offset="1" stop-color="#a8a29e"/>
    </linearGradient>
  </defs>
  <rect width="700" height="300" rx="16" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="350" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#292524">求人倍率のくらべかた（2026年）</text>

  <!-- 1x line -->
  <line x1="212" y1="70" x2="212" y2="245" stroke="#a8a29e" stroke-dasharray="5 4"/>
  <text x="212" y="264" text-anchor="middle" font-size="11" fill="#78716c">1.0倍＝求人と求職者が同数</text>

  <!-- bar 1 -->
  <text x="150" y="102" text-anchor="end" font-size="14" fill="#57534e">全職業の平均</text>
  <rect x="160" y="86" width="62" height="24" rx="6" fill="url(#barGray)"/>
  <text x="232" y="103" font-size="14" font-weight="bold" fill="#57534e">1.18倍</text>

  <!-- bar 2 -->
  <text x="150" y="162" text-anchor="end" font-size="14" fill="#57534e">建設・採掘の仕事</text>
  <rect x="160" y="146" width="312" height="24" rx="6" fill="url(#barOrange)"/>
  <text x="482" y="163" font-size="14" font-weight="bold" fill="#ea580c">5.94倍</text>

  <!-- bar 3 -->
  <text x="150" y="222" text-anchor="end" font-size="14" fill="#57534e">建設躯体工事</text>
  <rect x="160" y="206" width="393" height="24" rx="6" fill="url(#barOrange)"/>
  <text x="563" y="223" font-size="14" font-weight="bold" fill="#ea580c">7.48倍</text>
</svg>
