<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="700" height="260" rx="16" fill="#fefce8"/>
  <text x="350" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#854d0e">現場の熱中症対策は「会社の義務」になっている</text>

  <!-- condition box -->
  <rect x="35" y="65" width="200" height="130" rx="12" fill="#ffffff" stroke="#fde047"/>
  <text x="135" y="98" text-anchor="middle" font-size="24">🌡️</text>
  <text x="135" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">こんな現場では…</text>
  <text x="135" y="146" text-anchor="middle" font-size="11.5" fill="#57534e">暑さ指数28以上/気温31℃以上</text>
  <text x="135" y="164" text-anchor="middle" font-size="11.5" fill="#57534e">で連続1時間・1日4時間超の作業</text>

  <text x="253" y="138" font-size="20" fill="#ca8a04">→</text>

  <!-- duty box -->
  <rect x="280" y="65" width="200" height="130" rx="12" fill="#ffffff" stroke="#fde047"/>
  <text x="380" y="98" text-anchor="middle" font-size="24">📋</text>
  <text x="380" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">会社がやるべきこと</text>
  <text x="380" y="146" text-anchor="middle" font-size="11.5" fill="#57534e">報告体制・対応手順づくり</text>
  <text x="380" y="164" text-anchor="middle" font-size="11.5" fill="#57534e">全員への周知(罰則つき義務)</text>

  <text x="498" y="138" font-size="20" fill="#ca8a04">→</text>

  <!-- check box -->
  <rect x="525" y="65" width="140" height="130" rx="12" fill="#ffffff" stroke="#fde047"/>
  <text x="595" y="98" text-anchor="middle" font-size="24">✅</text>
  <text x="595" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">転職者の視点</text>
  <text x="595" y="146" text-anchor="middle" font-size="11.5" fill="#57534e">空調服・休憩・バディ制</text>
  <text x="595" y="164" text-anchor="middle" font-size="11.5" fill="#57534e">=良い会社の見分け方</text>

  <text x="350" y="234" text-anchor="middle" font-size="11" fill="#a8a29e">※2025年6月から罰則つきで義務化。2026年はガイドライン強化・対象が個人事業者にも拡大</text>
</svg>
