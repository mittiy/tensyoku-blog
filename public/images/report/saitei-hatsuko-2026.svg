<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="700" height="320" rx="16" fill="#fff7ed"/>
  <text x="350" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a3412">新しい最低賃金はいつから? 今年は発効日にばらつき</text>

  <!-- Oct block -->
  <rect x="40" y="70" width="300" height="170" rx="10" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="190" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#ea580c">10月発効(大半の都道府県)</text>
  <text x="190" y="130" text-anchor="middle" font-size="13" fill="#7c2d12">10月1日から順次、新しい時給に</text>
  <text x="190" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">東京 1,280円 / 大阪 1,231円</text>
  <text x="190" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">千葉 1,195円 (答申額)</text>
  <text x="190" y="222" text-anchor="middle" font-size="12" fill="#a16207">全国加重平均の目安は 1,176円(+55円)</text>

  <!-- Nov block -->
  <rect x="360" y="70" width="300" height="80" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="510" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">11月発効の県も</text>
  <text x="510" y="122" text-anchor="middle" font-size="12" fill="#713f12">山梨・京都・徳島・愛媛・大分 など</text>

  <!-- Dec block -->
  <rect x="360" y="160" width="300" height="80" rx="10" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="510" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">12月発効も</text>
  <text x="510" y="212" text-anchor="middle" font-size="12" fill="#7f1d1d">岩手 など</text>

  <text x="350" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">→ 自分の県の「発効日」を確認してから時給を見直そう</text>
  <text x="350" y="300" text-anchor="middle" font-size="11" fill="#a8a29e">※2026年9月2日時点で46都道府県が答申済み。金額・発効日は正式決定を各労働局で確認を</text>
</svg>
