<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <linearGradient id="mwbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="700" height="300" rx="16" fill="#fff7ed"/>
  <text x="350" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a3412">最低賃金(時給)の目安が決まった</text>

  <!-- bar current -->
  <rect x="180" y="120" width="120" height="120" rx="8" fill="#d6d3d1"/>
  <text x="240" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#57534e">1,121円</text>
  <text x="240" y="262" text-anchor="middle" font-size="13" fill="#78716c">現在(2025年度)</text>

  <!-- arrow -->
  <text x="340" y="185" font-size="24" fill="#ea580c" text-anchor="middle">→</text>
  <text x="340" y="150" font-size="14" font-weight="bold" fill="#ea580c" text-anchor="middle">+55円</text>
  <text x="340" y="215" font-size="12" fill="#a8a29e" text-anchor="middle">+4.9%</text>

  <!-- bar new -->
  <rect x="390" y="100" width="120" height="140" rx="8" fill="url(#mwbar)"/>
  <text x="450" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#ea580c">1,176円</text>
  <text x="450" y="262" text-anchor="middle" font-size="13" fill="#78716c">2026年度の目安(全国平均)</text>

  <text x="350" y="290" text-anchor="middle" font-size="11" fill="#a8a29e">※2026年7月28日答申。都道府県ごとに決定後、例年10月ごろから順次適用</text>
</svg>
