<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="700" height="430" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="350" y="42" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">勤め先が地震で休業したときの主な支援の入り口</text>

  <!-- start -->
  <rect x="235" y="65" width="230" height="52" rx="10" fill="#475569"/>
  <text x="350" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">職場が休業・操業停止になった</text>

  <line x1="350" y1="117" x2="350" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="140" x2="570" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="140" x2="130" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="350" y1="140" x2="350" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="570" y1="140" x2="570" y2="160" stroke="#94a3b8" stroke-width="2"/>

  <!-- path 1 -->
  <rect x="30" y="160" width="200" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="130" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">会社に在籍したまま</text>
  <text x="130" y="212" text-anchor="middle" font-size="12" fill="#475569">休業手当(給料の6割以上)</text>
  <text x="130" y="232" text-anchor="middle" font-size="12" fill="#475569">が支払われるケース</text>
  <text x="130" y="262" text-anchor="middle" font-size="11" fill="#64748b">会社は国の助成金</text>
  <text x="130" y="280" text-anchor="middle" font-size="11" fill="#64748b">(雇用調整助成金)を使える</text>

  <!-- path 2 -->
  <rect x="250" y="160" width="200" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="350" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">休業手当が出ない場合</text>
  <text x="350" y="212" text-anchor="middle" font-size="12" fill="#475569">辞めていなくても</text>
  <text x="350" y="232" text-anchor="middle" font-size="12" fill="#475569">失業保険を受け取れる特例</text>
  <text x="350" y="262" text-anchor="middle" font-size="11" fill="#64748b">災害救助法の適用地域で</text>
  <text x="350" y="280" text-anchor="middle" font-size="11" fill="#64748b">事業所が休止した場合など</text>

  <!-- path 3 -->
  <rect x="470" y="160" width="200" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="570" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">勤務中にけがをした</text>
  <text x="570" y="212" text-anchor="middle" font-size="12" fill="#475569">労災保険の対象になる</text>
  <text x="570" y="232" text-anchor="middle" font-size="12" fill="#475569">可能性(治療費・休業補償)</text>
  <text x="570" y="262" text-anchor="middle" font-size="11" fill="#64748b">アルバイト・派遣・期間工も</text>
  <text x="570" y="280" text-anchor="middle" font-size="11" fill="#64748b">雇用形態を問わず対象</text>

  <!-- bottom -->
  <rect x="120" y="335" width="460" height="52" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="350" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3730a3">迷ったら: ハローワーク・労働局の特別相談窓口へ(無料)</text>
  <text x="350" y="376" text-anchor="middle" font-size="11" fill="#6366f1">「泣き寝入り」する前に、必ず一度相談を</text>

  <text x="350" y="412" text-anchor="middle" font-size="10.5" fill="#94a3b8">※制度の適用条件は状況により異なります。最新情報は厚生労働省・ハローワークでご確認ください</text>
</svg>
