<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="700" height="360" rx="16" fill="#f8fafc"/>
  <text x="350" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">2026年9月・地域別ひとことまとめ</text>

  <rect x="40" y="60" width="300" height="80" rx="10" fill="#dbeafe"/>
  <text x="190" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">関東</text>
  <text x="190" y="112" text-anchor="middle" font-size="12" fill="#1e3a8a">秋着工ラッシュ本番。採用は即決モード</text>
  <text x="190" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a">東京の最低賃金は1,280円へ</text>

  <rect x="360" y="60" width="300" height="80" rx="10" fill="#fce7f3"/>
  <text x="510" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#be185d">関西</text>
  <text x="510" y="112" text-anchor="middle" font-size="12" fill="#831843">IR関連は継続。人手不足で好条件が続く</text>
  <text x="510" y="130" text-anchor="middle" font-size="12" fill="#831843">経験者は条件交渉のしどき</text>

  <rect x="40" y="150" width="300" height="80" rx="10" fill="#dcfce7"/>
  <text x="190" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">東海</text>
  <text x="190" y="202" text-anchor="middle" font-size="12" fill="#14532d">時給相場は10月の発効で一段上へ</text>
  <text x="190" y="220" text-anchor="middle" font-size="12" fill="#14532d">EV・電池関連の投資は継続</text>

  <rect x="360" y="150" width="300" height="80" rx="10" fill="#ffedd5"/>
  <text x="510" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">九州・熊本</text>
  <text x="510" y="202" text-anchor="middle" font-size="12" fill="#7c2d12">地震から1ヶ月、復旧需要が本格化</text>
  <text x="510" y="220" text-anchor="middle" font-size="12" fill="#7c2d12">TSMC第2工場は工事再開の動き</text>

  <rect x="40" y="240" width="300" height="80" rx="10" fill="#e0e7ff"/>
  <text x="190" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">北海道</text>
  <text x="190" y="292" text-anchor="middle" font-size="12" fill="#312e81">ラピダス稼働1年。組織拡大フェーズへ</text>
  <text x="190" y="310" text-anchor="middle" font-size="12" fill="#312e81">量産前の未経験採用は残りわずか?</text>

  <rect x="360" y="240" width="300" height="80" rx="10" fill="#fef9c3"/>
  <text x="510" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#a16207">全国共通</text>
  <text x="510" y="292" text-anchor="middle" font-size="12" fill="#713f12">求人倍率1.18倍で横ばい・売り手継続</text>
  <text x="510" y="310" text-anchor="middle" font-size="12" fill="#713f12">製造業の新規求人は増加(+6.8%)</text>

  <text x="350" y="348" text-anchor="middle" font-size="11" fill="#94a3b8">※2026年9月時点の公表情報をもとにした当サイト作成のまとめ</text>
</svg>
