<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- helmet ridge (wide top bump) -->
  <rect x="23" y="15" width="18" height="14" rx="7" fill="#ffffff"/>
  <!-- helmet dome -->
  <path d="M14 40 a18 18 0 0 1 36 0 z" fill="#ffffff"/>
  <!-- groove lines on dome -->
  <rect x="21.5" y="30" width="3" height="10" rx="1.5" fill="#ea580c" opacity="0.55"/>
  <rect x="39.5" y="30" width="3" height="10" rx="1.5" fill="#ea580c" opacity="0.55"/>
  <!-- brim -->
  <rect x="8" y="40" width="48" height="7" rx="3.5" fill="#ffffff"/>
